# Local Selenium Grid: 1 hub + Chrome and Firefox nodes.
#   Start:  docker compose up -d
#   View:   http://localhost:4444  (live sessions; noVNC on 7900/7901, password "secret")
#   Run:    mvn test -DgridUrl=http://localhost:4444 -Dbrowser=chrome
#   Stop:   docker compose down
services:
  selenium-hub:
    image: selenium/hub:latest
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:latest
    shm_size: 2gb
    depends_on: [selenium-hub]
    ports: ["7900:7900"]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3

  firefox:
    image: selenium/node-firefox:latest
    shm_size: 2gb
    depends_on: [selenium-hub]
    ports: ["7901:7900"]
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
